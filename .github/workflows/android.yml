name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Menggunakan versi Java setup terbaru yang didukung saat ini
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Script otomatis untuk mencari di mana letak file gradlew berada
      - name: Make Gradle Executable
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          if [ -n "$GRADLEW_PATH" ]; then
            chmod +x "$GRADLEW_PATH"
            echo "Gradlew ditemukan di: $GRADLEW_PATH"
          else
            echo "ERROR: File gradlew tidak ditemukan di repositori ini!"
            exit 1
          fi

      # Otomatis masuk ke folder proyek dan menjalankan build
      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          cd "$DIR_PATH"
          ./gradlew assembleDebug

      # Mengambil file APK dari folder mana pun di dalam proyek
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
